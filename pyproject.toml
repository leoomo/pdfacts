[project]
name = "pdfacts"
version = "0.2.0"
description = "Structured, verifiable facts from PDF files: text, paths, images, annotations and forms with explicit geometry."
readme = "README.md"
requires-python = ">=3.13"
# Engine versions are pinned exactly: extracted facts depend on the engine
# build, so an engine upgrade is a reviewed change, never a side effect.
dependencies = [
    "pypdfium2==5.13.0",
    "pikepdf==10.14.0",
]
classifiers = [
    # Blocks accidental uploads to a public index while the project is private.
    "Private :: Do Not Upload",
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[dependency-groups]
bench = [
    "cryptography==50.0.2",
    "pymupdf==1.28.2",
    "pypdf==6.19.0",
]
dev = [
    "numpy==2.5.3",
    "pytest>=8.3",
    "ruff>=0.8",
    "scipy==1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfacts"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "tools", "docs", "README.md", "ROADMAP.md", "THIRD_PARTY.md", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "tools", "bench"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
